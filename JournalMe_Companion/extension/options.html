<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JournalMe Companion Settings</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#090b0a; color:#f2f4f5; }
    main { max-width:720px; margin:40px auto; padding:20px; }
    .card { display:grid; gap:16px; background:#101411; border:1px solid #29322b; border-radius:14px; padding:18px; }
    label { display:grid; gap:8px; color:#aab2ad; }
    input[type="text"] { width:100%; padding:10px; background:#0d100e; border:1px solid #29322b; border-radius:9px; color:#f2f4f5; }
    .check { grid-template-columns:auto 1fr; align-items:center; }
    button { padding:10px 14px; border:0; border-radius:9px; background:#ccefd8; color:#102418; font-weight:800; cursor:pointer; }
    #status { color:#9ce1b7; min-height:20px; }
    p { color:#96a099; line-height:1.6; }
    code { color:#ccefd8; }
  </style>
</head>
<body>
  <main>
    <h1>JournalMe Companion</h1>
    <div class="card">
      <label>
        JournalMe API root
        <input id="apiBase" type="text" value="http://127.0.0.1:8066" />
      </label>
      <label>
        JournalMe web app
        <input id="appBase" type="text" value="http://localhost:3070" />
      </label>
      <label class="check">
        <input id="autoRouteAfterSave" type="checkbox" checked />
        <span>Route the JournalMe web tab to the saved capture after each save</span>
      </label>
      <button id="save" type="button">Save settings</button>
      <div id="status"></div>
    </div>
    <p>The normal hosted setup is done from the Companion side panel with <strong>Connect web</strong>. These fields remain available for local development and troubleshooting.</p>
    <p>Capture shortcut: <code>Alt+C</code>.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
